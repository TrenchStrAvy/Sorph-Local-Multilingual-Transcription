<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: absolute; inset: 0; perspective: 950px; display: grid; place-items: center; }
  .card { grid-area: 1 / 1; width: 220px; height: 275px; border-radius: 9px; overflow: hidden; opacity: 0;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.28), 0 2px 6px rgba(0, 0, 0, 0.12); backface-visibility: hidden;
    -webkit-backface-visibility: hidden; will-change: transform, opacity; }
  .card canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="dist/language-card.js"></script>
</body>
</html>
